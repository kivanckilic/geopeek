name: Deploy app + daily NORAD TLE

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # once a day, 02:17 UTC (05:17 Istanbul)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site and fetch GEO element sets from CelesTrak
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp -r index.html manifest.webmanifest sw.js icons site/
          curl -fsS --retry 3 --retry-delay 30 \
            -A "AntennaLookAngles-PWA (GitHub Actions, one download per day)" \
            "https://celestrak.org/NORAD/elements/gp.php?GROUP=geo&FORMAT=tle" \
            -o site/data/geo.tle
          # refuse to publish anything that is not TLE text (e.g. a 403 explanation page)
          grep -q '^1 ' site/data/geo.tle && grep -q '^2 ' site/data/geo.tle
          N=$(grep -c '^1 ' site/data/geo.tle)
          printf '{"fetched":"%s","source":"CelesTrak GROUP=geo","count":%s}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$N" > site/data/meta.json
          echo "Published $N element sets"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
