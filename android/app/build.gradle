plugins {
    id 'com.android.application'
}

// Version code comes from the CI run number so every build installs over the previous one.
def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'io.github.kivanckilic.geopeek'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.kivanckilic.geopeek'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "2.0.${vc}"
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'geopeek'
                keyPassword System.getenv('KEYSTORE_PASS')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
