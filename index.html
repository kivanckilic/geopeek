<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14" id="themeMeta">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEOpeek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>GEOpeek</title>
<style>
/* GEOpeek mobile — a night-sky field instrument.
   Hierarchy: azimuth + elevation are the answer (largest), skew/range/delay secondary, everything else in sheets.
   Theme tokens: light by default here, dark via prefers-color-scheme or data-theme. The globe card is always "space". */
:root{
  --bg:#eef2f8;--bg2:#e4eaf3;--card:#ffffff;--card2:#f6f8fc;--ink:#0b1424;--mute:#5b6779;--faint:#8a95a6;--line:rgba(11,20,36,.09);
  --acc:#0a8a5f;--accInk:#ffffff;--accSoft:rgba(10,138,95,.12);--cyan:#0b7fc4;--warn:#b54708;--good:#12a464;--wait:#d99a00;--bad:#d9541e;
  --heroA:#0f2f4a;--heroB:#0a1a2c;--heroInk:#f2fbff;--heroMute:rgba(220,240,255,.68);--heroAcc:#7ee2a8;
  --shadow:0 1px 2px rgba(11,20,36,.06),0 8px 24px rgba(11,20,36,.07);--r:20px;
}
:root[data-theme=dark]{
  --bg:#070b14;--bg2:#0b1220;--card:#0f1726;--card2:#131d2f;--ink:#e8eef7;--mute:#93a0b4;--faint:#5f6b7e;--line:rgba(255,255,255,.07);
  --acc:#7ee2a8;--accInk:#062014;--accSoft:rgba(126,226,168,.12);--cyan:#5cc8ff;--warn:#ffb380;--good:#4ade80;--wait:#fbbf24;--bad:#fb7a52;
  --heroA:#10314e;--heroB:#0a1626;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#070b14;--bg2:#0b1220;--card:#0f1726;--card2:#131d2f;--ink:#e8eef7;--mute:#93a0b4;--faint:#5f6b7e;--line:rgba(255,255,255,.07);
  --acc:#7ee2a8;--accInk:#062014;--accSoft:rgba(126,226,168,.12);--cyan:#5cc8ff;--warn:#ffb380;--good:#4ade80;--wait:#fbbf24;--bad:#fb7a52;
  --heroA:#10314e;--heroB:#0a1626;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;
  background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%) fixed;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* app bar */
.bar{position:sticky;top:0;z-index:6;padding:calc(env(safe-area-inset-top) + 8px) 0 8px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:19px;letter-spacing:-.02em;margin-right:auto}
.brand svg{width:30px;height:30px}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.ib svg{width:22px;height:22px}
.status{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute);cursor:pointer;max-width:100%}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}.dot.bad{background:var(--bad)}.dot.wait{background:var(--wait)}

/* satellite picker */
.satcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;min-height:64px}
.satcard .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc)}
.satcard .tx{flex:1}.satcard b{display:block;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.satcard small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.satcard .chev{color:var(--faint)}

/* hero: azimuth + elevation */
.hero{margin-top:12px;border-radius:24px;padding:16px;color:var(--heroInk);position:relative;overflow:hidden;
  background:radial-gradient(130% 90% at 0% 0%,var(--heroA),var(--heroB));box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06)}
.hero::after{content:"";position:absolute;inset:auto -30% -60% auto;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(126,226,168,.16),transparent 65%);pointer-events:none}
.hero.down{background:radial-gradient(130% 90% at 0% 0%,#4a2a14,#1e1208)}
.ae{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;position:relative;z-index:1}
.tile{border-radius:18px;padding:12px 12px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);container-type:inline-size}
.tile .h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--heroAcc)}
.tile .ks{font-size:11px;color:var(--heroMute);text-transform:none;letter-spacing:0;font-weight:500}
.tile .v{font-size:clamp(36px,30cqi,72px);font-weight:750;line-height:1;margin:8px 0 6px;white-space:nowrap}
.tile .v sup{font-size:.45em;font-weight:600;vertical-align:.95em;margin-left:1px;opacity:.85}
.tile .s{font-size:13px;color:var(--heroMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg.g{width:38px;height:38px;flex:none}
.minor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;position:relative;z-index:1}
.m{border-radius:14px;padding:9px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.m .k{font-size:11px;color:var(--heroMute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m .v{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px;white-space:nowrap}
.m .s{font-size:11.5px;color:var(--heroMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* visual card */
.viz{margin-top:12px;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.viz .tabs{display:flex;align-items:center;gap:8px;padding:10px 10px 0}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;min-height:36px;padding:4px 14px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs .sp{flex:1}
.mini{min-height:36px;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.stage{position:relative;margin:10px;border-radius:18px;overflow:hidden;aspect-ratio:1/1}
.space{background:radial-gradient(90% 90% at 50% 40%,#0d1e36 0%,#060c18 55%,#03060d 100%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#globe:active{cursor:grabbing}
.legend{position:absolute;left:10px;right:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:rgba(220,235,255,.75);pointer-events:none}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cap{font-size:12px;color:var(--mute);padding:0 14px 12px}
#dial{width:100%;height:100%;display:block}

/* pointing aid */
.point{margin-top:12px}
.bigbtn{width:100%;min-height:54px;border-radius:16px;border:0;background:var(--acc);color:var(--accInk);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow)}
.bigbtn.off{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.guide{display:none;margin-top:10px;border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line)}
.guide.on{display:block}.guide.hit{background:var(--accSoft);border-color:var(--acc)}
.guide .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.guide .k{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}.guide .big{font-size:30px;font-weight:750}
.hint{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.45}

/* details */
.det{margin-top:12px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
details+details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;min-height:54px;display:flex;align-items:center;justify-content:space-between;font-weight:650;padding:0 16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
dl{margin:0;padding:0 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:14.5px}
dt{color:var(--mute);padding:8px 10px 8px 0;border-top:1px solid var(--line)}dd{margin:0;padding:8px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.foot{font-size:11.5px;color:var(--faint);padding:16px 18px 28px;max-width:560px;margin:0 auto;line-height:1.5}

/* sheets */
dialog{border:0;padding:0;width:100%;max-width:600px;max-height:92vh;margin:auto auto 0;border-radius:26px 26px 0 0;background:var(--card);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.35)}
dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}
dialog::backdrop{background:rgba(3,6,13,.55);backdrop-filter:blur(2px)}
.sheet{padding:8px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;max-height:92vh}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px 0 8px;flex:none}
.sheet>*{flex:none}.sheet>#tlePane{flex:1 1 auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sheethead h2{margin:0;font-size:21px;letter-spacing:-.01em}
.sec{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 5px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
input:disabled{opacity:.6}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg.full{display:grid;width:100%}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);margin:10px 0 0}.chk input{width:22px;min-height:22px;height:22px;accent-color:var(--acc)}
.list{overflow:auto;flex:1;min-height:200px;border:1px solid var(--line);border-radius:16px;margin-top:10px;background:var(--card2)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item.sel{background:var(--accSoft)}.item.sel .nm{color:var(--acc)}.item .nm{font-weight:650}.item .sub{font-size:12.5px;color:var(--mute)}.item .ae2{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.results{display:flex;flex-direction:column;margin-top:6px}.res{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px;padding:10px 4px;min-height:48px;cursor:pointer}.res small{color:var(--mute);font-size:13px;white-space:nowrap}
.saved{display:flex;flex-direction:column;gap:6px}.site{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card2)}.site.on{border-color:var(--acc);background:var(--accSoft)}.site>button{border:0;background:transparent;cursor:pointer}.site .use{flex:1;text-align:left;padding:8px 12px;min-height:50px}.site .use small{display:block;font-size:12.5px;color:var(--mute)}.site .del{width:48px;font-size:20px;color:var(--mute)}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.slots button{font-size:14px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 13px;min-height:40px;cursor:pointer}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:650;font-size:14.5px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg{font-size:13px;margin-top:6px;color:var(--mute)}.msg.bad{color:var(--warn)}
@media(min-width:900px){.wrap{max-width:1100px}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.foot{max-width:1100px}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#7ee2a8"/></linearGradient></defs><circle cx="16" cy="16" r="7" fill="url(#lg)"/><ellipse cx="16" cy="16" rx="14" ry="5.2" fill="none" stroke="url(#lg)" stroke-width="1.8" transform="rotate(-18 16 16)"/><circle cx="28.6" cy="11.9" r="2.2" fill="#fff"/></svg>GEOpeek</div>
  <button class="ib" id="setBtn" data-ta="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
</div></header>

<div class="wrap">
  <div class="status">
    <button class="chip" id="gpsChip"><span class="dot wait" id="gpsDot"></span><span id="gpsTxt" data-t="locating">Locating…</span></button>
    <button class="chip" id="dataChip"><span class="dot wait" id="dataDot"></span><span id="dataTxt" data-t="loadingData">Loading data…</span></button>
  </div>
</div>

<main class="wrap"><div class="cols">
  <div>
    <button class="satcard" id="satBtn" aria-haspopup="dialog">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7 9 3 5 7l4 4M17 11l4 4-4 4-4-4M8 12l4 4M16 8l3-3"/><path d="m9 15-3 3M3 21c0-3 1-4 3-5"/></svg></span>
      <span class="tx"><b id="satName" data-t="selectSat">Select satellite</b><small id="satSub" data-t="tapToChoose">Tap to choose</small></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>
    </button>

    <section class="hero" id="hero" aria-live="polite">
      <div class="ae">
        <div class="tile">
          <div class="h"><div><div class="k" data-t="az">Azimuth</div><div class="ks" data-t="azSub">true north</div></div>
            <svg class="g" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/><path d="M20 3v4M37 20h-4M20 37v-4M3 20h4" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><g id="azNeedle"><path d="M20 6 23.5 20 20 18 16.5 20Z" fill="#7ee2a8"/><path d="M20 34 23.5 20 20 22 16.5 20Z" fill="rgba(255,255,255,.25)"/></g></svg></div>
          <div class="v num" id="vAz">—</div><div class="s num" id="vAzM">—</div>
        </div>
        <div class="tile">
          <div class="h"><div><div class="k" data-t="el">Elevation</div><div class="ks" data-t="elSub">with refraction</div></div>
            <svg class="g" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 36H36" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><path d="M36 36A32 32 0 0 0 4 4" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5" transform="translate(0 0)"/><line id="elLine" x1="4" y1="36" x2="36" y2="36" stroke="#7ee2a8" stroke-width="2.6" stroke-linecap="round"/><circle cx="4" cy="36" r="2.4" fill="#fff"/></svg></div>
          <div class="v num" id="vEl">—</div><div class="s num" id="vElS">—</div>
        </div>
      </div>
      <div class="minor">
        <div class="m"><div class="k" data-t="skew">LNB skew</div><div class="v num" id="vSk">—</div><div class="s" id="vSkS">—</div></div>
        <div class="m"><div class="k" data-t="range">Range</div><div class="v num" id="vRg">—</div><div class="s" id="vRgS">—</div></div>
        <div class="m"><div class="k" data-t="motor">Motor</div><div class="v num" id="vHa">—</div><div class="s" id="vHaS">DiSEqC</div></div>
      </div>
    </section>

    <section class="point">
      <button class="bigbtn" id="pointBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span id="pointTxt" data-t="pointStart">Start pointing aid</span></button>
      <div class="guide" id="guide" aria-live="polite">
        <div class="row"><div><div class="k" id="gTurnK" data-t="turn">Turn</div><div class="big num" id="gTurn">—</div></div><div><div class="k" id="gTiltK" data-t="tilt">Tilt</div><div class="big num" id="gTilt">—</div></div></div>
        <div class="hint" id="gNote" data-t="aimNote">Hold the phone upright and aim the back camera at the sky.</div>
      </div>
      <div class="hint" data-t="compassWarn"></div>
    </section>
  </div>

  <div>
    <section class="viz">
      <div class="tabs">
        <div class="seg" role="group"><button id="vGlobe" aria-pressed="true" data-t="globe">Globe</button><button id="vSky" aria-pressed="false" data-t="sky">Sky</button></div>
        <span class="sp"></span><button class="mini" id="recenter" data-t="recenter">Recenter</button>
      </div>
      <div class="stage space" id="globeStage">
        <canvas id="globe" role="img" data-ta="globeAria"></canvas>
        <div class="legend"><span><i style="background:#8ff0c0"></i><span data-t="legendVis"></span></span><span><i style="background:rgba(140,160,190,.7)"></i><span data-t="legendHid"></span></span><span><i style="background:#ffcf5a"></i><span data-t="legendYou"></span></span></div>
      </div>
      <div class="stage" id="skyStage" hidden><svg id="dial" viewBox="0 0 400 400" role="img" data-ta="skyAria"></svg></div>
      <div class="cap" id="vizCap" data-t="globeHint"></div>
    </section>
    <section class="det" id="det"></section>
  </div>
</div></main>
<div class="foot" data-t="foot"></div>

<dialog id="satDlg"><div class="sheet">
  <div class="sheethead"><h2 data-t="satellite">Satellite</h2><button class="btn pri" data-close data-t="done">Done</button></div>
  <div class="seg full"><button id="srcTle" aria-pressed="true" data-t="srcTle">NORAD TLE</button><button id="srcSlot" aria-pressed="false" data-t="srcSlot">Orbital slot</button></div>
  <div id="tlePane" style="display:flex;flex-direction:column;min-height:0;flex:1">

  else { $('gTiltK').textContent = T('tilt'); $('gTilt').textContent = T('holdUpright'); }
  if (aim.src !== 'relative') $('gNote').textContent = aim.upright ? T('camAim', { a: f(aim.az, 1), e: f(aim.el, 1), ta: f(r.azTrue, 1), te: f(target, 1) }) : T('flatAim', { a: f(aim.az, 1) });
  const hit = dAz != null && Math.abs(dAz) < 2 && dEl != null && Math.abs(dEl) < 1 && aim.src !== 'relative';
  g.classList.toggle('hit', hit); if (hit && !aim.hit && navigator.vibrate) navigator.vibrate(80); aim.hit = hit;
}
async function togglePoint() {
  if (aim.on) { aim.on = false; removeEventListener('deviceorientationabsolute', onOri); removeEventListener('deviceorientation', onOri); $('guide').classList.remove('on'); $('pointTxt').textContent = T('pointStart'); $('pointBtn').classList.remove('off'); if (aim.lock) { aim.lock.release().catch(() => { }); aim.lock = null; } if (last) drawDial(last.s, last.r); return; }
  if (typeof DeviceOrientationEvent === 'undefined') { $('guide').classList.add('on'); $('gNote').textContent = T('noSensors'); return; }
  let perm = 'granted';
  try { if (typeof DeviceOrientationEvent.requestPermission === 'function') perm = await DeviceOrientationEvent.requestPermission(); } catch (e) { perm = 'error'; }
  aim.on = true; aim.az = aim.el = aim.se = aim.iosOff = null; aim.sx = aim.sy = 0;
  if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onOri); else addEventListener('deviceorientation', onOri);
  $('guide').classList.add('on'); $('pointTxt').textContent = T('pointStop'); $('pointBtn').classList.add('off'); $('gNote').textContent = T('waitSensors');
  if (st.view !== 'sky') setView('sky');   // the dial shows the phone's aim against the target
  aim.got = false; setTimeout(() => { if (aim.on && !aim.got) $('gNote').textContent = T('noOriData') + (perm !== 'granted' ? T('noOriPerm') : ''); }, 3000);
  try { if (navigator.wakeLock) aim.lock = await navigator.wakeLock.request('screen'); } catch (e) { }
}

// ---------- satellite sheet ----------
function renderList() {
  const q = $('q').value.trim().toUpperCase(), vo = $('visOnly').checked;
  const rows = sats.map(s => ({ s, p: pos.get(s.id) })).filter(({ s, p }) => p && (!vo || p.el > 0) && (!q || s.name.toUpperCase().includes(q) || s.id.includes(q))).sort((a, b) => b.p.sp.lon - a.p.sp.lon);
  $('list').innerHTML = rows.slice(0, 300).map(({ s, p }) => `<div class="item${s.id === st.sel ? ' sel' : ''}" data-id="${esc(s.id)}" role="button" tabindex="0"><div class="nm">${esc(s.name)}</div><div class="ae2">${f(p.az, 1)}° / ${f(p.el, 1)}°</div><div class="sub">${ew(p.sp.lon)} · ${esc(s.id)}</div><div class="sub ae2">${esc(T('azEl'))}</div></div>`).join('') || `<div class="item"><div class="sub">${esc(sats.length ? T('noMatch') : T('noTle'))}</div></div>`;
}
function setSrc(src) { st.src = src; save(); $('srcTle').setAttribute('aria-pressed', src === 'tle'); $('srcSlot').setAttribute('aria-pressed', src === 'slot'); $('tlePane').hidden = src !== 'tle'; $('tlePane').style.display = src === 'tle' ? 'flex' : 'none'; $('slotPane').hidden = src !== 'slot'; renderAll(); }

// ---------- wire up ----------
for (const k of ['lat', 'lon', 'hgt', 'off', 'mag', 'slot']) if (st[k] != null) $(k).value = st[k];
$('magAuto').checked = st.magAuto; $('visOnly').checked = st.visOnly; $('mag').disabled = st.magAuto;
$('slots').innerHTML = SLOTS.map(([n, l]) => `<button data-l="${l}">${esc(n)}</button>`).join('');
$('slots').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { $('slot').value = b.dataset.l; save(); renderAll(); $('satDlg').close(); } });
for (const k of ['lat', 'lon', 'hgt']) $(k).addEventListener('input', () => { if (st.loc === 'gps') setLoc('manual'); if (k !== 'hgt') st.siteName = ''; save(); computeAll(); renderAll(); renderSaved(); });
$('place').addEventListener('input', () => { clearTimeout(placeTimer); placeTimer = setTimeout(searchPlace, 400); });
$('places').addEventListener('click', e => { const b = e.target.closest('.res'); if (!b) return; useSite({ lat: +b.dataset.lat, lon: +b.dataset.lon, h: b.dataset.h === '' || b.dataset.h == null ? null : +b.dataset.h }, b.dataset.n); $('places').innerHTML = ''; $('place').value = ''; });
$('saved').addEventListener('click', e => { const u = e.target.closest('[data-i]'), d = e.target.closest('[data-d]');
  if (u) { const x = sites[+u.dataset.i]; useSite(x, x.name); }
  if (d) { sites.splice(+d.dataset.d, 1); LS.set('la.m.sites', sites); renderSaved(); } });
$('demBtn').addEventListener('click', siteHeight);
$('saveSite').addEventListener('click', () => { $('saveRow').hidden = !$('saveRow').hidden; if (!$('saveRow').hidden) { $('siteName').value = st.loc === 'gps' ? T('mySite', { d: new Date().toLocaleDateString() }) : (st.siteName || ''); $('siteName').focus(); } });
$('saveOk').addEventListener('click', () => { const s = site(new Date()), name = $('siteName').value.trim() || T('siteN', { n: sites.length + 1 }); if (!s) return;
  sites = sites.filter(x => x.name !== name); sites.unshift({ name, lat: s.lat, lon: s.lon, h: s.h }); LS.set('la.m.sites', sites.slice(0, 30));
  $('saveRow').hidden = true; if (st.loc === 'manual') st.siteName = name; save(); renderSaved(); gpsStatus(); locMsg(T('savedOk', { n: name }) + (st.loc === 'gps' ? T('savedGps') : '')); });
for (const k of ['off', 'mag', 'slot']) $(k).addEventListener('input', () => { save(); renderAll(); });
$('magAuto').addEventListener('change', () => { $('mag').disabled = $('magAuto').checked; save(); renderAll(); });
$('live').addEventListener('change', () => { $('tm').disabled = $('live').checked; if (!$('live').checked && !$('tm').value) $('tm').value = new Date().toISOString().slice(0, 16); computeAll(); renderAll(); });
$('tm').addEventListener('input', () => { computeAll(); renderAll(); });
$('locGps').addEventListener('click', () => setLoc('gps')); $('locMan').addEventListener('click', () => setLoc('manual'));
$('satBtn').addEventListener('click', () => { computeAll(); renderList(); $('satDlg').showModal(); });
$('setBtn').addEventListener('click', () => $('setDlg').showModal()); $('gpsChip').addEventListener('click', () => { $('setDlg').showModal(); $('locGps').scrollIntoView({ block: 'nearest' }); }); $('dataChip').addEventListener('click', () => { $('setDlg').showModal(); $('dataMsg').scrollIntoView({ block: 'nearest' }); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
$('q').addEventListener('input', renderList); $('visOnly').addEventListener('change', () => { save(); renderList(); });
$('list').addEventListener('click', e => { const it = e.target.closest('.item[data-id]'); if (it) { st.sel = it.dataset.id; save(); renderAll(); $('satDlg').close(); } });
$('srcTle').addEventListener('click', () => { setSrc('tle'); renderList(); }); $('srcSlot').addEventListener('click', () => setSrc('slot'));
$('pointBtn').addEventListener('click', togglePoint);
$('refresh').addEventListener('click', () => { $('dataMsg').textContent = T('checking'); loadData(true); });
$('file').addEventListener('change', async e => { const fl = e.target.files[0]; if (!fl) return; if (useText(await fl.text(), { at: Date.now(), src: 'file ' + fl.name })) { dataErr = ''; setSrc('tle'); } else { dataErr = T('badFile'); } renderAll(); });
$('vGlobe').addEventListener('click', () => setView('globe')); $('vSky').addEventListener('click', () => setView('sky'));
$('recenter').addEventListener('click', () => globe && globe.recenter());
for (const [id, l] of [['lngTr', 'tr'], ['lngEn', 'en']]) $(id).addEventListener('click', () => { st.lang = T.lang = l; save(); applyLang(); renderAll(); renderSaved(); });
for (const [id, v] of [['thAuto', 'auto'], ['thLight', 'light'], ['thDark', 'dark']]) $(id).addEventListener('click', () => { st.theme = v; save(); applyTheme(); renderAll(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

applyTheme(); applyLang();
const cached = LS.get('la.m.tle'); if (cached && cached.text) useText(cached.text, { at: cached.at, src: cached.src });
setSrc(st.src); setLoc(st.loc); setView(st.view === 'sky' ? 'sky' : 'globe');
loadData(false).then(() => { if (!sats.length && st.src === 'tle') setSrc('slot'); });
setInterval(() => { if ($('live').checked) { computeAll(); renderAll(); } }, 5000);
setInterval(() => loadData(false), 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { computeAll(); renderAll(); loadData(false); } });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
</script>
